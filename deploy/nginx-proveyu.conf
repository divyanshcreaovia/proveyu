# nginx in front of ProveYu on one EC2 server. Replace proveyu.example.com with your domain and get the certificate with
#   sudo systemctl stop nginx && sudo certbot certonly --standalone -d proveyu.example.com --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
# The backend listens only on 127.0.0.1:8080 (SERVER_ADDRESS=127.0.0.1); only ports 80 and 443 are open to the internet.

# keep the JWT that the chat WebSocket carries in its query string out of the access log
log_format proveyu '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;   # extra brake on sign-in, before the backend's own limit

server {
    listen 80;
    server_name proveyu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proveyu.example.com;

    # filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/proveyu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proveyu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/proveyu.access.log proveyu;
    server_tokens off;
    client_max_body_size 15m;          # documents 10 MB, interview answers up to 12 MB

    # ---- security headers for the web app
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera, microphone and screen share are used by the AI interview and mock-test proctoring on this site only.
    # CSP: 'wasm-unsafe-eval' + worker-src let the mock-test AI proctoring run its face and voice models (WebAssembly, served from /proctor/).
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://proveyu.example.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- Angular app (npx ng build -> Frontend/dist/proveyu-frontend/browser copied to /var/www/proveyu)
    root /var/www/proveyu;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # AI proctoring models and WebAssembly (face model, MediaPipe, Silero VAD, ONNX runtime): about 35 MB, downloaded once per browser
    location ^~ /proctor/ {
        types { application/wasm wasm; text/javascript js mjs; application/octet-stream onnx task; }
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # backend trusts this only from 127.0.0.1 (TRUSTED_PROXIES)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;       # AI interview calls can take a while
    }
    location ~ ^/api/v1/(auth|college/auth)/ {
        limit_req zone=signin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- chat WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- never served to the internet
    location ~ ^/(actuator|swagger-ui|v3/api-docs) {
        return 404;
    }
}
