<div class="settings-container" style="max-width: 900px;">
  <div class="card card-shadow border-0">
    <div class="border-bottom px-4 pt-3 bg-white" style="border-top-left-radius: 16px; border-top-right-radius: 16px;">
      <ul class="nav nav-tabs border-0 gap-4" id="settingsTabs">
        <li class="nav-item">
          <button class="nav-link bg-transparent border-0 fw-medium pb-3 px-1 position-relative" [class.active]="activeTab === 'notifications'" (click)="activeTab = 'notifications'">Notifications</button>
        </li>
        <li class="nav-item">
          <button class="nav-link bg-transparent border-0 fw-medium pb-3 px-1 text-muted-custom" [class.active]="activeTab === 'privacy'" (click)="activeTab = 'privacy'">Privacy</button>
        </li>
        <li class="nav-item">
          <button class="nav-link bg-transparent border-0 fw-medium pb-3 px-1 text-muted-custom" [class.active]="activeTab === 'account'" (click)="activeTab = 'account'">Account</button>
        </li>
      </ul>
    </div>
    
    <div class="p-4 p-md-5">
      <div *ngIf="activeTab === 'notifications'">
        <div class="row g-5">
          <div class="col-md-7">
            <h5 class="fw-bold text-navy mb-4">Notification Preferences</h5>
            
            <div class="d-flex flex-column gap-4">
              <div class="d-flex justify-content-between align-items-center" *ngFor="let item of notificationSettings">
                <div>
                  <div class="fw-bold text-navy mb-1">{{ item.label }}</div>
                  <div class="text-muted-custom small">{{ item.desc }}</div>
                </div>
                <div class="form-check form-switch ms-3">
                  <input class="form-check-input fs-5 cursor-pointer shadow-none" type="checkbox" [checked]="item.checked">
                </div>
              </div>
            </div>
          </div>
          
          <div class="col-md-5 border-start-md ps-md-5 mt-5 mt-md-0">
            <h5 class="fw-bold text-navy mb-4">Notification Types</h5>
            
            <div class="d-flex flex-column gap-3">
              <div class="form-check" *ngFor="let type of notificationTypes">
                <input class="form-check-input cursor-pointer shadow-none" type="checkbox" [checked]="type.checked" [id]="'type_' + type.label">
                <label class="form-check-label fw-medium text-navy cursor-pointer" [for]="'type_' + type.label">
                  {{ type.label }}
                </label>
              </div>
            </div>
          </div>
        </div>
        
        <div class="mt-5 pt-4 border-top">
          <button class="btn btn-primary-custom px-4">Save Changes</button>
        </div>
      </div>
      
      <div *ngIf="activeTab === 'privacy'" class="text-center py-5 text-muted-custom">
        Privacy settings placeholder
      </div>
      <div *ngIf="activeTab === 'account'" class="text-center py-5 text-muted-custom">
        Account settings placeholder
      </div>
    </div>
  </div>
</div>
