<header class="candidate-header bg-white card-shadow px-4 py-3 d-flex align-items-center justify-content-between">
  <!-- Search Bar -->
  <div class="search-wrapper position-relative" style="max-width: 400px; width: 100%;">
    <i class="bi bi-search position-absolute text-muted-custom" style="top: 50%; left: 1rem; transform: translateY(-50%);"></i>
    <input type="text" class="form-control bg-light-blue border-0 ps-5 py-2 rounded-pill shadow-none" placeholder="Search anything...">
  </div>

  <!-- Profile & Actions -->
  <div class="header-actions d-flex align-items-center gap-4">
    <!-- Notification Bell -->
    <button class="btn btn-link text-muted-custom p-0 position-relative">
      <i class="bi bi-bell fs-5"></i>
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
        <span class="visually-hidden">New alerts</span>
      </span>
    </button>
    
    <!-- Profile Dropdown -->
    <div class="profile-dropdown d-flex align-items-center gap-2 cursor-pointer">
      <div class="avatar rounded-circle overflow-hidden border" style="width: 40px; height: 40px;">
        <img src="https://ui-avatars.com/api/?name=Rahul+Sharma&background=0D8ABC&color=fff" alt="Candidate" class="w-100 h-100 object-fit-cover">
      </div>
      <div class="profile-info d-none d-md-block">
        <div class="fw-bold text-navy lh-1">Rahul Sharma</div>
        <small class="text-muted-custom" style="font-size: 0.75rem;">Candidate</small>
      </div>
      <i class="bi bi-chevron-down text-muted-custom ms-1" style="font-size: 0.8rem;"></i>
    </div>
  </div>
</header>
