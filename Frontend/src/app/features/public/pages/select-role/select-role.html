<div class="select-role-wrapper py-4 d-flex align-items-center justify-content-center position-relative overflow-hidden"
  style="min-height: calc(100vh - 80px); background: radial-gradient(circle at 70% 20%, rgba(0, 87, 255, 0.08) 0%, transparent 60%), radial-gradient(circle at 20% 80%, rgba(10, 27, 63, 0.04) 0%, transparent 50%);">

  <!-- Top-Right Decorative Thread Line -->
  <svg class="position-absolute top-0 end-0 d-none d-lg-block pe-none" width="230" height="230" viewBox="0 0 230 230"
    fill="none" style="z-index: 10;">
    <path d="M 215 15 Q 135 25 105 105 T 20 180" stroke="#0057ff" stroke-width="2.5" stroke-dasharray="6 6" fill="none"
      opacity="0.4" />
    <polygon points="27,170 16,183 31,184" fill="#0057ff" opacity="0.75" />
  </svg>

  <div class="container-custom py-2 position-relative" style="z-index: 1;">

    <div class="mx-auto" style="max-width: 860px;">
      <div class="card card-shadow border-0 p-4 p-md-5 bg-white rounded-4">

        <!-- Header -->
        <div class="text-center mb-4">
          <a routerLink="/" class="d-inline-block mb-2">
            <img src="images/logo1.png" alt="ProveYu Logo" style="height: 44px; width: auto;">
          </a>
          <h1 class="h4 fw-extrabold text-navy mb-0">ProveYu Registration</h1>
        </div>

        <div class="mb-4 text-start">
          <h2 class="h5 fw-bold text-navy mb-1">Create an Account</h2>
          <p class="text-muted-custom fs-7 mb-0">Fill in your details below to register.</p>
        </div>

        <div>
          <div class="row g-3 text-start">
            <div class="col-md-12">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">I am registering as a</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                  </svg>
                </span>
                <select class="form-select border-start-0 py-2.5 px-3 fs-7 text-navy fw-medium" [(ngModel)]="formData.role">
                  <option value="CANDIDATE">Candidate (Job Seeker / Fresher)</option>
                  <option value="RECRUITER">Recruiter (Agency / Company)</option>
                </select>
              </div>
            </div>
            
            <div class="col-md-6">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <input type="text" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="formData.fullName"
                  placeholder="Rahul Sharma" autocomplete="new-password" required>
              </div>
            </div>
            
            <div class="col-md-6">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                </span>
                <input type="email" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="formData.email"
                  placeholder="rahul.sharma@example.com" autocomplete="new-password" required>
              </div>
            </div>
            
            <div class="col-md-6">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                  </svg>
                </span>
                <input type="tel" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="formData.phone"
                  placeholder="+91 98765 43210" autocomplete="new-password" required>
              </div>
            </div>
            
            <div class="col-md-6 d-none d-md-block">
                <!-- Spacer for alignment -->
            </div>
            
            <div class="col-md-6">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="formData.password"
                  placeholder="Create a password" autocomplete="new-password" required>
              </div>
            </div>
            
            <div class="col-md-6">
              <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted fs-7">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="formData.confirmPassword"
                  placeholder="Confirm password" autocomplete="new-password" required>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end align-items-center pt-4 border-top mt-4">
          <button type="button" class="btn btn-success px-5 py-2.5 rounded-pill text-white fw-bold shadow"
            (click)="submitRegistration()">
            Submit Registration &rarr;
          </button>
        </div>

      </div>

      <div class="text-center pt-3 fs-7 text-muted-custom mt-2">
        Already have an account? <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Sign In Here &rarr;</a>
      </div>
    </div>
  </div>

  <!-- SUBMISSION CONFIRMATION MODAL OVERLAY -->
  <div *ngIf="isSubmitted"
    class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-dark bg-opacity-50"
    style="z-index: 1050; backdrop-filter: blur(4px);">
    <div class="card card-shadow border-0 p-5 bg-white rounded-4 text-center shadow-lg" style="max-width: 460px;">
      <div
        class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center mx-auto mb-3 shadow"
        style="width: 64px; height: 64px; font-size: 28px;">
        ✓
      </div>
      <h3 class="h4 fw-bold text-navy mb-2">Registration Submitted!</h3>
      <p class="text-muted-custom fs-7 mb-4">
        Your account has been created. Redirecting to login page...
      </p>
      <div class="spinner-border text-primary mx-auto" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>
