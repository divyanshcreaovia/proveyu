<div class="login-wrapper py-4 d-flex align-items-center justify-content-center position-relative overflow-hidden"
  style="min-height: calc(100vh - 80px); background: radial-gradient(circle at 70% 20%, rgba(0, 87, 255, 0.08) 0%, transparent 60%), radial-gradient(circle at 20% 80%, rgba(10, 27, 63, 0.04) 0%, transparent 50%);">

  <!-- Top Decorative SVG Thread Line -->
  <svg class="position-absolute top-0 end-0 d-none d-lg-block pe-none" width="220" height="220" viewBox="0 0 220 220"
    fill="none" style="z-index: 10; margin-top: 10px; margin-right: 10px;">
    <path d="M 205 15 Q 120 25 90 95 T 15 160" stroke="#0057ff" stroke-width="2.5" stroke-dasharray="6 6" fill="none"
      opacity="0.35" />
    <polygon points="23,150 10,165 26,166" fill="#0057ff" opacity="0.6" />
  </svg>

  <div class="container-custom py-2 position-relative" style="z-index: 1;">
    <div class="card card-shadow border-0 p-4 p-md-5 bg-white mx-auto rounded-4" style="max-width: 640px;">

      <!-- Header -->
      <div class="text-center mb-4">
        <a routerLink="/" class="d-inline-block mb-2">
          <img src="images/logo1.png" alt="ProveYu Logo" style="height: 48px; width: auto;">
        </a>
        <h1 class="h4 fw-extrabold text-navy mb-0">Sign In to ProveYu</h1>
      </div>



      <!-- Success Alert Banner -->
      <div *ngIf="loginSuccessMessage"
        class="alert alert-success d-flex align-items-center mb-4 rounded-3 py-2.5 px-3 fs-7 border-0 shadow-sm"
        role="alert">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <div>{{ loginSuccessMessage }}</div>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin($event)">
        <div class="mb-3 text-start">
          <label class="form-label text-navy fw-semibold fs-7 mb-1.5">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted fs-7">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </span>
            <input type="email" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="email" name="email_login_new"
              placeholder="name@company.com" autocomplete="new-password" required>
          </div>
        </div>

        <div class="mb-3 text-start">
          <div class="d-flex justify-content-between align-items-center mb-1.5">
            <label class="form-label text-navy fw-semibold fs-7 mb-0">Password</label>
            <a href="javascript:void(0)" (click)="onForgotPassword($event)"
              class="text-primary text-decoration-none fs-8 fw-semibold">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted fs-7">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" class="form-control border-start-0 py-2.5 px-3 fs-7" [(ngModel)]="password"
              name="password_login_new" placeholder="••••••••" autocomplete="new-password" required>
          </div>
        </div>



        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe">
            <label class="form-check-label text-navy fs-8 fw-medium" for="rememberMe">
              Remember me on this device
            </label>
          </div>
        </div>

        <button type="submit"
          class="btn btn-primary-custom w-100 py-3 mb-3 fw-bold text-white shadow d-flex align-items-center justify-content-center gap-2"
          style="background-color: #273247 !important; color: white !important;"
          [style.opacity]="isLoggingIn ? '0.85' : '1'"
          [attr.disabled]="isLoggingIn ? true : null">
          <span *ngIf="isLoggingIn" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>{{ isLoggingIn ? 'Authenticating...' : 'Sign In to Dashboard →' }}</span>
        </button>
      </form>

      <div class="text-center pt-3 fs-7 text-muted-custom border-top mt-4">
        Don't have an account yet? <a routerLink="/select-role" class="text-primary fw-bold text-decoration-none">Get
          Verified &rarr;</a>
      </div>
    </div>
  </div>
</div>
