<div class="bg-primary text-white text-center py-2 fs-7"
  style="background: linear-gradient(90deg, #0044cc 0%, #0077ff 100%);">
  <div class="container-custom d-flex justify-content-center align-items-center">
    <span class="badge bg-warning text-dark me-2 rounded-pill px-2 py-1" style="font-size: 0.7rem;">New!</span>
    <span class="fw-medium">Verified Skill Passports are now live. Build credibility and stand out to top
      employers.</span>
    <a routerLink="/how-it-works"
      class="text-white ms-3 text-decoration-none border-bottom border-white fw-semibold">Learn more &rarr;</a>
    <button class="btn-close btn-close-white ms-auto" style="font-size: 0.6rem;"></button>
  </div>
</div>

<nav class="navbar navbar-expand-lg bg-white sticky-top py-3 border-bottom shadow-sm">
  <div class="container-custom d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center me-5" routerLink="/">
      <img src="images/logo1.png" alt="ProveYu Logo" style="height: 48px; width: auto;">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto gap-4">
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/how-it-works" routerLinkActive="active">How It Works</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/why-in-person" routerLinkActive="active">Why In-Person</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/fresher-model" routerLinkActive="active">Fresher Model</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3 ms-4">
        <ng-container *ngIf="!isCandidatePortal">
          <a routerLink="/login" class="btn btn-outline-custom py-2 px-4 text-decoration-none">Login</a>
          <a routerLink="/select-role" class="btn btn-primary-custom py-2 px-4 text-decoration-none">Get Verified</a>
        </ng-container>

        <ng-container *ngIf="isCandidatePortal">
          <!-- Search Bar -->
          <div class="search-wrapper position-relative me-3 d-none d-md-block" style="width: 250px;">
            <input type="text" class="form-control bg-light-blue border-0 ps-4 pe-5 py-2 rounded-pill shadow-none" placeholder="Search anything...">
            <i class="bi bi-search position-absolute text-muted-custom" style="top: 50%; right: 1rem; transform: translateY(-50%); pointer-events: none;"></i>
          </div>
        
          <!-- Notification Bell -->
          <button class="btn btn-link text-muted-custom p-0 position-relative me-2">
            <i class="bi bi-bell fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
              <span class="visually-hidden">New alerts</span>
            </span>
          </button>
          
          <!-- Profile Dropdown -->
          <div class="profile-dropdown d-flex align-items-center gap-2 cursor-pointer border-start ps-3 ms-2">
            <div class="avatar rounded-circle overflow-hidden border" style="width: 40px; height: 40px;">
              <img src="https://ui-avatars.com/api/?name=Rahul+Sharma&background=0D8ABC&color=fff" alt="Candidate" class="w-100 h-100 object-fit-cover">
            </div>
            <div class="profile-info d-none d-lg-block text-start">
              <div class="fw-bold text-navy lh-1" style="font-size: 0.9rem;">Rahul Sharma</div>
              <small class="text-muted-custom" style="font-size: 0.75rem;">Candidate</small>
            </div>
            <i class="bi bi-chevron-down text-muted-custom ms-1" style="font-size: 0.8rem;"></i>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
