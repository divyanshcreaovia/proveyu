@if (showBanner() && banner(); as b) {
  <div class="text-white text-center py-2 fs-7 announce-bar">
    <div class="container-custom d-flex justify-content-center align-items-center gap-2">
      <span class="badge bg-warning text-dark rounded-pill px-2 py-1" style="font-size: 0.7rem;">New</span>
      <span class="fw-medium announce-text">{{ b.text }}</span>
      @if (b.link) {
        @if (external(b.link)) {
          <a [href]="b.link" target="_blank" rel="noopener" class="text-white ms-2 text-decoration-none border-bottom border-white fw-semibold text-nowrap">See how &rarr;</a>
        } @else {
          <a [routerLink]="path(b.link)" [fragment]="fragment(b.link)" class="text-white ms-2 text-decoration-none border-bottom border-white fw-semibold text-nowrap">See how &rarr;</a>
        }
      }
      <button type="button" class="btn-close btn-close-white ms-auto" style="font-size: 0.6rem;" aria-label="Close announcement"
        (click)="showBanner.set(false)"></button>
    </div>
  </div>
}

<nav class="navbar navbar-expand-lg bg-white sticky-top py-3 border-bottom shadow-sm" aria-label="Main">
  <div class="container-custom d-flex align-items-center flex-wrap">
    <a class="navbar-brand d-flex align-items-center me-5" routerLink="/" (click)="open.set(false)">
      <img src="images/logo1.png" alt="ProveYu home" style="height: 48px; width: auto;">
    </a>

    <button class="navbar-toggler ms-auto" type="button" (click)="open.set(!open())" [attr.aria-expanded]="open()"
      aria-controls="navbarNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="open()" id="navbarNav">
      <ul class="navbar-nav mx-auto gap-lg-4 gap-2 py-3 py-lg-0">
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/for-colleges" routerLinkActive="active" (click)="open.set(false)">For Colleges</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/for-students" routerLinkActive="active" (click)="open.set(false)">For Students</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/how-it-works" routerLinkActive="active" (click)="open.set(false)">How It Works</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" routerLink="/pricing" routerLinkActive="active" (click)="open.set(false)">Pricing</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3 ms-lg-4 pb-3 pb-lg-0">
        <a routerLink="/login" class="btn btn-outline-custom py-2 px-4 text-decoration-none" (click)="open.set(false)">Sign in</a>
        <a routerLink="/select-role" class="btn btn-primary-custom py-2 px-4 text-decoration-none" (click)="open.set(false)">Get started</a>
      </div>
    </div>
  </div>
</nav>
