spring:
  application:
    name: ${SPRING_APPLICATION_NAME:proveyu-backend}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.0.68:3307/PROVEYU?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Proveyu@321@}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:info@proveyu.com}
    password: ${SPRING_MAIL_PASSWORD:info@Dcore1}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000

server:
  port: ${SERVER_PORT:8080}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/resumes}

jwt:
  secret: ${JWT_SECRET:ProveyuSuperSecretSigningKeyForJWTAuthentication2026SecureKey!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

razorpay:
  key_id: ${RAZORPAY_KEY_ID:rzp_test_proveyu_key}
  key_secret: ${RAZORPAY_KEY_SECRET:proveyu_test_secret_321}
  webhook_secret: ${RAZORPAY_WEBHOOK_SECRET:proveyu_webhook_secret_321}
  mock_mode: ${RAZORPAY_MOCK_MODE:true}

uan:
  verification_url: ${UAN_VERIFICATION_URL:https://api.epfo.gov.in/uan/verify}
  api_key: ${UAN_VERIFICATION_API_KEY:mock_uan_key_321}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.proveyu: ${LOGGING_LEVEL_PROVEYU:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:INFO}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit-per-minute: ${AUTH_LIMIT_PER_MINUTE:60}
