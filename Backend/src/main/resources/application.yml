spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
  application:
    name: ${SPRING_APPLICATION_NAME:proveyu-backend}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/PROVEYU?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}          # 127.0.0.1 in production behind nginx: the backend is not reachable from outside
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}   # native behind nginx, so https and the client address are known

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/resumes}

chat:
  file:
    upload-dir: ${CHAT_FILE_UPLOAD_DIR:uploads/chat}
    max-file-size-bytes: ${CHAT_MAX_FILE_SIZE:10485760}
    allowed-extensions: ${CHAT_ALLOWED_EXTENSIONS:.pdf,.doc,.docx,.jpg,.jpeg,.png}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.proveyu: ${LOGGING_LEVEL_PROVEYU:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:INFO}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

security:
  # Reverse proxies whose X-Forwarded-For is believed for the rate limit (127.0.0.1 when nginx runs on the same server).
  # Empty: the header is ignored, so a client cannot pretend to be many addresses.
  trusted-proxies: ${TRUSTED_PROXIES:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit-per-minute: ${AUTH_LIMIT_PER_MINUTE:60}
    user-limit-per-minute: ${USER_LIMIT_PER_MINUTE:120}


app:
  # Public URL of the Angular app, used in e-mail links (verification, invites, password reset)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  contact-email: ${APP_CONTACT_EMAIL:support@proveyu.com}   # shown in e-mail footers as the address people write to
  dev:
    # NEVER enable in production: returns OTP / verification / invite tokens in API responses and logs them
    expose-tokens: ${APP_DEV_EXPOSE_TOKENS:false}

college:
  # When true, newly registered colleges stay PENDING until a platform ADMIN approves them
  require-admin-approval: ${COLLEGE_REQUIRE_APPROVAL:true}
  file:
    upload-dir: ${COLLEGE_FILE_UPLOAD_DIR:uploads/college}
    max-file-size-bytes: ${COLLEGE_MAX_FILE_SIZE:10485760}
    allowed-extensions: ${COLLEGE_ALLOWED_EXTENSIONS:.pdf,.doc,.docx,.jpg,.jpeg,.png,.xlsx,.xls,.csv}

# AI mock interview (Preparation > AI interview). Services start with: cd ai-services && docker compose up -d
interview:
  # Cloud AI (OpenAI-compatible; Groq by default). On only when GROQ_API_KEY is set (Backend/.env,
  # git-ignored). Failures and rate limits fall back to the local
  # services below. To use an own model server later: set INTERVIEW_CLOUD_URL to it (e.g. http://gpu-box:11434/v1) or drop the key.
  cloud:
    api-key: ${GROQ_API_KEY:} # several keys, comma-separated (key1,key2,key3): used in turn; a rate-limited key is skipped until it recovers
    url: ${INTERVIEW_CLOUD_URL:https://api.groq.com/openai/v1}
    model: ${INTERVIEW_CLOUD_MODEL:openai/gpt-oss-20b}          # questions + follow-ups
    eval-model: ${INTERVIEW_CLOUD_EVAL_MODEL:openai/gpt-oss-20b} # scoring + report (openai/gpt-oss-120b is stronger)
    reasoning-effort: ${INTERVIEW_CLOUD_REASONING:low}          # gpt-oss: low keeps replies fast; blank to not send it
    stt-model: ${INTERVIEW_CLOUD_STT_MODEL:whisper-large-v3-turbo} # blank = keep speech-to-text local
    stt-language: ${INTERVIEW_CLOUD_STT_LANGUAGE:}               # blank = auto-detect (handles Hinglish); "en" forces English
    stt-prompt: ${INTERVIEW_CLOUD_STT_PROMPT:A job interview answer by an Indian engineering student. Technical terms such as Java, Python, SQL, API, Spring Boot, Angular, React, DBMS, OOPS.}
    max-parallel: ${INTERVIEW_CLOUD_MAX_PARALLEL:4}
    # Local models (Ollama, whisper.cpp, Piper). true: used when every Groq key fails (and when no key is set). false: Groq only,
    # nothing local is called, questions are read by the browser's voice. AI_LOCAL_MODELS_ENABLED wins over the older name.
    fallback-local: ${AI_LOCAL_MODELS_ENABLED:${INTERVIEW_CLOUD_FALLBACK_LOCAL:true}}
  llm:
    url: ${INTERVIEW_LLM_URL:http://localhost:11434}
    model: ${INTERVIEW_LLM_MODEL:qwen3:1.7b}           # live interview: questions + follow-ups (qwen3:8b on a GPU server)
    eval-model: ${INTERVIEW_LLM_EVAL_MODEL:qwen3:1.7b} # background scoring + report (qwen3:4b is more precise, about 2x slower on CPU)
  stt:
    url: ${INTERVIEW_STT_URL:http://localhost:8178}
  tts:
    url: ${INTERVIEW_TTS_URL:http://localhost:5002}
  ai:
    timeout-seconds: ${INTERVIEW_AI_TIMEOUT:180}
    max-parallel: ${INTERVIEW_AI_MAX_PARALLEL:2}   # requests sent to the model server at once; the rest wait
  audio-dir: ${INTERVIEW_AUDIO_DIR:uploads/interviews}
  audio-retention-days: ${INTERVIEW_AUDIO_RETENTION_DAYS:30}
  free-every-days: ${INTERVIEW_FREE_EVERY_DAYS:15}     # one free interview per student every N days (clock starts when it ends)
  price-rupees: ${INTERVIEW_PRICE_RUPEES:20}          # price of one extra interview, paid by UPI QR (admin approves)
  max-per-purchase: ${INTERVIEW_MAX_PER_PURCHASE:10}
  upi:
    id: ${UPI_ID:}                                    # e.g. proveyu@okaxis (Backend/.env). Blank = buying is switched off
    name: ${UPI_PAYEE_NAME:ProveYu}                   # name shown on the QR and in the payment app
  questions: ${INTERVIEW_QUESTIONS:6}              # total per interview, follow-ups included
  follow-ups: ${INTERVIEW_FOLLOW_UPS:1}            # how many of those are follow-ups on an answer
  max-answer-seconds: ${INTERVIEW_MAX_ANSWER_SECONDS:180}

# First platform admin of a new installation (only used while no admin exists; remove after the first start)
support:
  # Optional: every new Help & support request is also e-mailed here (e.g. support@proveyu.com). Empty = admin portal only.
  inbox-email: ${SUPPORT_INBOX_EMAIL:}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Platform admin}

# Mock tests (Preparation > Mock tests)
prep:
  unlock-percent: ${PREP_UNLOCK_PERCENT:50}                    # next ladder test opens above this best score
  max-tab-switch-warnings: ${PREP_MAX_TAB_SWITCH_WARNINGS:2}   # leaving the test this many times = warnings; the next time submits it
  proctor-dir: ${PREP_PROCTOR_DIR:uploads/proctor}             # screenshots taken when a student leaves a test (proof)
  proctor-retention-days: ${PREP_PROCTOR_RETENTION_DAYS:0}     # delete screenshots older than this every night; 0 = keep
  ai-proctoring:
    enabled: ${PREP_AI_PROCTORING_ENABLED:true}               # camera + microphone check before a mock test (false = screen share only)
  max-ai-warnings: ${PREP_MAX_AI_WARNINGS:5}                  # AI events (no face, voice, ...) before the attempt is flagged; never submits it

# Coding questions (Run and Submit). Default provider: Judge0 CE on its own VM. Local dev: SSH tunnel to localhost:2358.
# Moving to production changes only env vars (JUDGE0_URL = the Judge0 VM's internal IP, JUDGE0_TOKEN). See Backend/.env.example.
code:
  execution:
    provider: ${CODE_EXECUTION_PROVIDER:judge0}          # judge0 (default) | docker (legacy, needs the Docker socket on this host)
    rate-limit-seconds: ${CODE_RUN_RATE_LIMIT_SECONDS:5} # min seconds between two Run (or two Submit) clicks by one student; 0 = off
    queue-wait-ms: ${CODE_QUEUE_WAIT_MS:20000}           # how long a run waits for a free Judge0 slot before "judge busy"
    max-source-bytes: 65536
    max-stdin-bytes: 1048576          # admin test inputs can be large (Judge0 accepts 1 MB); student Code ground input is capped at 64 KB in code
    max-output-bytes: 65536
    judge0:
      url: ${JUDGE0_URL:http://localhost:2358}
      token: ${JUDGE0_TOKEN:}                            # sent in the auth header; never logged
      auth-header: ${JUDGE0_AUTH_HEADER:X-Auth-Token}
      poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:300}
      poll-timeout-ms: ${JUDGE0_POLL_TIMEOUT_MS:30000}
      max-parallel: ${JUDGE0_MAX_PARALLEL:4}             # concurrent runs this backend sends to Judge0
      connect-timeout-ms: ${JUDGE0_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${JUDGE0_READ_TIMEOUT_MS:15000}
      cpu-time-limit-seconds: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:3}
      wall-time-limit-seconds: ${JUDGE0_WALL_TIME_LIMIT_SECONDS:8}
      memory-limit-kb: ${JUDGE0_MEMORY_LIMIT_KB:262144}
      max-cpu-time-limit-seconds: 10                     # hard caps: config above these is clamped
      max-wall-time-limit-seconds: 15
      max-memory-limit-kb: 524288
      max-batch-size: 20
    # Judge0 language_id per language key. Verify with GET /languages on your Judge0 before going live.
    languages:
      python: 71
      c: 50
      cpp: 54
      java: 62
      javascript: 63
# Price, free days, UPI, warnings, unlock score, retention and the website banner can also be changed in Admin > Settings.

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}       # false in production: the API list and Swagger UI are not served
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

# Off-campus jobs: nightly import of fresher jobs and internships from the Careerjet API (key from a Careerjet publisher account:
# https://www.careerjet.co.in/partners/api). Imported ads arrive as drafts in Admin > Off-campus jobs > Imported; only the last
# `days` days are kept. Each field (software, data, mechanical, ...) gets a fresher search and an internship search across India.
offcampus:
  import:
    cron: ${OFFCAMPUS_IMPORT_CRON:0 0 0 * * *}   # every night at 12
    zone: Asia/Kolkata
    days: 15
    careerjet:
      api-key: ${CAREERJET_API_KEY:}
      locale: en_IN
      pages: ${CAREERJET_PAGES:2}                # 100 ads per page, per search
      user-ip: ${CAREERJET_USER_IP:}             # blank = the server's public IP (looked up at import time)
      referer: ${CAREERJET_REFERER:}             # the website URL declared in the Careerjet publisher account (required by Careerjet)

# Health: the app is UP when it and its database work. Mail is sent in the background and a slow or failing SMTP server must not
# mark the whole backend DOWN (the mail check also held every health request for up to 10 s).
management:
  health:
    mail:
      enabled: false

# CXO portal (college leadership): AI-built dashboards. The model only picks metrics from a fixed catalog; it never writes SQL.
cxo:
  ai:
    api-key: ${CXO_GROQ_API_KEY:}                       # separate from the AI interview key; blank = rule-based planner
    url: ${CXO_AI_URL:https://api.groq.com/openai/v1}   # any OpenAI-compatible endpoint
    model: ${CXO_AI_MODEL:openai/gpt-oss-120b}
    reasoning-effort: ${CXO_AI_REASONING:low}           # blank for models without reasoning
    timeout-seconds: ${CXO_AI_TIMEOUT:20}                # replies take 3-6 s; past this the rule-based planner answers
    max-parallel: ${CXO_AI_MAX_PARALLEL:4}
  query:
    timeout-seconds: ${CXO_QUERY_TIMEOUT:8}             # per widget query
  cache:                                                # AI answers only; widget numbers are always live
    plan-ttl-hours: ${CXO_CACHE_PLAN_TTL_HOURS:168}     # same question -> same dashboard plan for a week (0 = off)
    insight-ttl-hours: ${CXO_CACHE_INSIGHT_TTL_HOURS:24} # same numbers -> same summary for a day
    cleanup-cron: "0 30 3 * * *"
  stream:
    pace-ms: ${CXO_STREAM_PACE_MS:220}                  # gap between widgets so the dashboard visibly builds itself (0 = off)
    max-parallel: ${CXO_STREAM_MAX_PARALLEL:8}          # dashboards built at the same time
